name: Fovyn web checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_FOVYN_ENVIRONMENT: alpha
          VITE_SUPABASE_URL: https://ukvrfejyyhgnzljquxvt.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dl9JaUQp-U1dmuaGY1qu2A_oUHsatPt
