name: Fovyn V1.4 checks and Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_FOVYN_ENVIRONMENT: alpha
          VITE_SUPABASE_URL: https://ukvrfejyyhgnzljquxvt.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dl9JaUQp-U1dmuaGY1qu2A_oUHsatPt
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.11.1
      - run: gradle -p android-companion test assembleDebug --stacktrace
      - name: Package APK and ZIP
        run: |
          cp android-companion/app/build/outputs/apk/debug/app-debug.apk fovyn-health-v1.1.0-test.apk
          zip fovyn-health-v1.1.0-test.zip fovyn-health-v1.1.0-test.apk
      - uses: actions/upload-artifact@v5
        with:
          name: fovyn-health-v1.1.0-test
          path: |
            fovyn-health-v1.1.0-test.apk
            fovyn-health-v1.1.0-test.zip
          if-no-files-found: error
      - name: Publish direct test APK and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view fovyn-health-v1.1.0-test >/dev/null 2>&1; then
            gh release upload fovyn-health-v1.1.0-test fovyn-health-v1.1.0-test.apk fovyn-health-v1.1.0-test.zip --clobber
          else
            gh release create fovyn-health-v1.1.0-test fovyn-health-v1.1.0-test.apk fovyn-health-v1.1.0-test.zip \
              --prerelease \
              --title "Fovyn Health v1.1.0 test" \
              --notes "Test APK with measured workout calories, 14-day reconciliation and WorkManager background sync. Debug signed: uninstall an older test APK first if Android reports a signature mismatch."
          fi
