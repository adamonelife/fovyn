name: Fovyn V1.3 checks and Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_FOVYN_ENVIRONMENT: alpha
          VITE_SUPABASE_URL: https://ukvrfejyyhgnzljquxvt.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dl9JaUQp-U1dmuaGY1qu2A_oUHsatPt
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.11.1
      - run: gradle -p android-companion test assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-companion/app/build/outputs/apk/debug/app-debug.apk fovyn-health-debug.apk
      - uses: actions/upload-artifact@v5
        with:
          name: fovyn-health-debug
          path: fovyn-health-debug.apk
          if-no-files-found: error
      - name: Publish direct test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv fovyn-health-debug.apk fovyn-health-v1.0.1-test.apk
          if gh release view fovyn-health-v1.0.1-test >/dev/null 2>&1; then
            gh release upload fovyn-health-v1.0.1-test fovyn-health-v1.0.1-test.apk --clobber
          else
            gh release create fovyn-health-v1.0.1-test fovyn-health-v1.0.1-test.apk \
              --prerelease \
              --title "Fovyn Health v1.0.1 test" \
              --notes "Test APK with corrected Health Connect permission registration and diagnostics."
          fi
